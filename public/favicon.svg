<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Shadow & Base -->
  <path d="M32 4 C48 4 56 12 56 24 C56 42 32 58 32 60 C32 58 8 42 8 24 C8 12 16 4 32 4 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>
  
  <!-- Outer Protection Accent Border -->
  <path d="M32 7 C45 7 52 14 52 24 C52 39 32 53 32 55 C32 53 12 39 12 24 C12 14 19 7 32 7 Z" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Medical Cross / Shield Center -->
  <rect x="27.5" y="16" width="9" height="24" rx="3" fill="#ffffff"/>
  <rect x="20" y="23.5" width="24" height="9" rx="3" fill="#ffffff"/>
  
  <!-- IPC Green Sparkle / Hygiene Dot -->
  <circle cx="44" cy="15" r="4" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="44" cy="15" r="1.5" fill="#ffffff"/>
</svg>
